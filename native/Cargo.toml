[package]
name = "semantic-search-native"
version = "2.0.1"
edition = "2024"
rust-version = "1.92"

[dependencies]
eframe = { version = "=0.34.3", default-features = false, features = ["default_fonts", "glow", "wgpu", "accesskit"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico", "pnm"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
base64 = "=0.22.1"
sha2 = "0.10.9"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
matrixmultiply = "0.3.10"
pdf-extract = "0.10"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Security"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = true
panic = "unwind"
